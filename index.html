<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Homepage</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="navbar container">
      <div class="logo">BrandName</div>
      <ul class="nav-links">
        <li><a href="#">Головна</a></li>
        <li><a href="#">Про нас</a></li>
        <li><a href="#">Послуги</a></li>
        <li><a href="#">Контакти</a></li>
      </ul>
      <button class="btn">Увійти</button>
    </nav>
  </header>

  <main>
    <section class="hero container">
      <div class="hero-text">
        <h1>Ласкаво просимо до нашого сайту</h1>
        <p>Простий і сучасний лендинг, зроблений лише з HTML та CSS.</p>
        <button class="btn primary">Дізнатися більше</button>
      </div>
      <div class="hero-image">
        <img src="images/hero.png" alt="Hero Image">
      </div>
    </section>
  </main>
</body>
</html>
